{% extends 'base.html' %}

{% block content %}
<div class="auth-card card mx-auto shadow-sm">
    <div class="card-body p-5 text-center">
        <h2 class="fw-bold">Check Your Email</h2>
        <p class="text-secondary">
            If an account exists for that email address, a password
            reset link has been sent.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">
            Back to Login
        </a>
    </div>
</div>
{% endblock %}
